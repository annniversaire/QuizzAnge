<html lang="fr">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Quiz Anniversaire</title>

  <style>

    :root{
      --bg:#fff7f0;
      --card:#fff;
      --accent:#ff6f91;
      --accent2:#ffd166;
      --text:#333;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      margin:0;

      background:
        linear-gradient(
          135deg,
          var(--bg),
          #fff
        );

      min-height:100vh;
      min-height:100dvh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;
    }


    /* =====================================================
       CARTE
       ===================================================== */

    .card{

      background:var(--card);

      padding:2rem;

      border-radius:16px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);

      width:100%;
      max-width:620px;

      position:relative;
      overflow:hidden;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header{

      display:flex;

      gap:1rem;

      align-items:center;
    }


    .balloons{

      width:64px;
      height:64px;

      min-width:64px;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,0.6),
          transparent 20%
        ),
        linear-gradient(
          180deg,
          var(--accent),
          var(--accent2)
        );

      border-radius:50%;

      display:grid;
      place-items:center;

      color:white;

      font-weight:700;

      font-size:1.5rem;
    }


    h1{

      margin:0;

      font-size:1.4rem;

      color:var(--text);
    }


    p.lead{

      color:#666;

      margin-top:.4rem;

      line-height:1.45;
    }


    /* =====================================================
       QUESTION
       ===================================================== */

    .question{

      color:#666;

      margin:
        1.5rem 0 .7rem;

      line-height:1.4;

      font-weight:500;
    }


    /* =====================================================
       FORMULAIRE
       ===================================================== */

    form{

      margin-top:.5rem;

      width:100%;

      display:flex;

      flex-direction:column;

      gap:.8rem;
    }


    /* =====================================================
       ZONE DE SAISIE — LARGE
       ===================================================== */

    input[type="text"]{

      display:block;

      width:100%;

      max-width:100%;

      min-width:0;

      height:70px;

      padding:
        .8rem 1.2rem;

      border-radius:14px;

      border:
        3px dashed #f0a;

      outline:none;

      background:#fff;

      font-family:inherit;

      font-size:1.3rem;

      font-weight:500;

      text-align:center;

      letter-spacing:3px;
    }


    input[type="text"]::placeholder{

      color:#bbb;

      letter-spacing:2px;
    }


    input[type="text"]:focus{

      border-color:var(--accent);

      box-shadow:
        0 0 0 4px
        rgba(255,111,145,.15);
    }


    /* =====================================================
       BOUTON
       ===================================================== */

    button{

      width:100%;

      height:58px;

      padding:
        .7rem 1rem;

      border-radius:12px;

      border:none;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          #ff4d6d
        );

      color:#fff;

      font-weight:700;

      font-size:1.05rem;

      font-family:inherit;

      cursor:pointer;

      touch-action:manipulation;
    }


    button:active{

      transform:scale(.98);
    }


    /* =====================================================
       RESULTAT
       ===================================================== */

    .result{

      margin-top:1rem;

      padding:1rem;

      border-radius:8px;

      background:#f9f9fb;

      color:var(--text);

      font-weight:600;

      line-height:1.4;

      text-align:center;
    }


    .good{

      background:
        linear-gradient(
          90deg,
          #e6ffef,
          #d6ffe6
        );

      color:#0b6b3a;
    }


    .bad{

      background:
        linear-gradient(
          90deg,
          #fff0f0,
          #ffecec
        );

      color:#8b1d1d;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer{

      margin-top:1rem;

      font-size:.85rem;

      color:#999;

      line-height:1.4;

      text-align:center;
    }


    /* =====================================================
       📱 TELEPHONE
       ===================================================== */

    @media (max-width:600px){

      body{

        padding:10px;
      }


      .card{

        width:100%;

        max-width:none;

        padding:1.2rem;

        border-radius:14px;
      }


      .header{

        gap:.8rem;
      }


      .balloons{

        width:52px;
        height:52px;

        min-width:52px;

        font-size:1.2rem;
      }


      h1{

        font-size:1.25rem;
      }


      p.lead{

        font-size:.92rem;
      }


      .question{

        font-size:.95rem;

        margin-top:1.3rem;
      }


      /*
        LE CHAMP PREND TOUTE
        LA LARGEUR DISPONIBLE
      */

      input[type="text"]{

        width:100%;

        height:72px;

        font-size:20px;

        letter-spacing:3px;
      }


      button{

        width:100%;

        height:58px;

        font-size:1.05rem;
      }


      footer{

        font-size:.78rem;
      }
    }


    /* =====================================================
       📱 PETIT TELEPHONE
       ===================================================== */

    @media (max-width:380px){

      body{

        padding:6px;
      }


      .card{

        padding:1rem;
      }


      .balloons{

        width:46px;
        height:46px;

        min-width:46px;
      }


      h1{

        font-size:1.15rem;
      }


      input[type="text"]{

        height:68px;

        font-size:19px;
      }
    }


    /* =====================================================
       📲 TABLETTE
       ===================================================== */

    @media (min-width:601px) and (max-width:900px){

      .card{

        max-width:700px;
      }


      input[type="text"]{

        height:74px;

        font-size:1.35rem;
      }


      button{

        height:60px;
      }
    }

  </style>
</head>


<body>

  <div class="card">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <div class="header">

      <div class="balloons">
        🎈
      </div>

      <div>

        <h1>
          Quiz anniversaire !
        </h1>

        <p class="lead">
          Ya Zinnna, réponds à la question pour découvrir
          un petit message secret.
        </p>

      </div>

    </div>


    <!-- ==================================================
         QUIZ
         ================================================== -->

    <form id="quiz">


      <p class="question">

        Quelle est la date de naissance d'OLE ?

        <br>

        <strong>
          Format : DD/MM
        </strong>

      </p>


      <!-- CHAMP LARGE -->

      <input
        id="date"
        name="date"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="5"
        placeholder="JJ/MM"
        aria-label="Date de naissance"
        required
      />


      <!-- BOUTON -->

      <button type="submit">
        Vérifier
      </button>


    </form>


    <!-- ==================================================
         RESULTAT
         ================================================== -->

    <div
      id="result"
      class="result"
      aria-live="polite"
      style="display:none"
    ></div>


    <!-- ==================================================
         INDICE
         ================================================== -->

    <footer>

      Indice : c'est tous les jours l'année
      de son anniversaire 😂

    </footer>


  </div>


  <script>


    // ==========================================================
    // HASH DE LA BONNE RÉPONSE
    // ==========================================================

    const correctHash =
      '3f27309197fe9f1762ac86b834b8e826d2c574d273b8aeec96bb377b7e66cddd';


    // ==========================================================
    // CONVERSION HASH → HEX
    // ==========================================================

    function bufToHex(buffer){

      const bytes =
        new Uint8Array(buffer);

      return Array
        .from(bytes)
        .map(
          b =>
            b
              .toString(16)
              .padStart(2,'0')
        )
        .join('');
    }


    // ==========================================================
    // NORMALISATION
    // ==========================================================

    function normalize(input){

      input =
        input.trim();

      input =
        input.replace(
          /\s+/g,
          ''
        );

      input =
        input.replace(
          /[\-._,]/g,
          '/'
        );


      /*
        0708
        devient
        07/08
      */

      if(
        !input.includes('/') &&
        /^\d{4}$/.test(input)
      ){

        input =
          input.slice(0,2) +
          '/' +
          input.slice(2);
      }


      return input;
    }


    // ==========================================================
    // SHA-256
    // ==========================================================

    async function sha256Hex(str){

      const enc =
        new TextEncoder();

      const data =
        enc.encode(str);

      const hashBuffer =
        await crypto.subtle.digest(
          'SHA-256',
          data
        );

      return bufToHex(
        hashBuffer
      );
    }


    // ==========================================================
    // SAISIE AUTOMATIQUE DU /
    // ==========================================================

    const inputEl =
      document.getElementById('date');


    inputEl.addEventListener(
      'input',
      function(){

        /*
          On garde uniquement
          les chiffres.
        */

        let value =
          this.value.replace(
            /\D/g,
            ''
          );


        /*
          Maximum 4 chiffres
        */

        value =
          value.slice(0,4);


        /*
          Après les 2 premiers chiffres :

          07

          devient

          07/
        */

        if(
          value.length >= 2
        ){

          value =
            value.slice(0,2) +
            '/' +
            value.slice(2);
        }


        /*
          DD/MM maximum
        */

        this.value =
          value.slice(0,5);
      }
    );


    // ==========================================================
    // VALIDATION
    // ==========================================================

    document
      .getElementById('quiz')
      .addEventListener(
        'submit',
        async function(e){

          e.preventDefault();


          const val =
            normalize(
              inputEl.value
            );


          const resultEl =
            document.getElementById(
              'result'
            );


          resultEl.style.display =
            '';


          /*
            Vérification du format
          */

          if(
            !/^\d{2}\/\d{2}$/.test(val)
          ){

            resultEl.textContent =
              'Format invalide — utilise DD/MM (ex : 05/10).';

            resultEl.className =
              'result bad';

            return;
          }


          /*
            Calcul SHA-256
          */

          const h =
            await sha256Hex(val);


          /*
            Bonne réponse
          */

          if(
            h === correctHash
          ){

              window.location.href = "https://annniversaire.github.io/Zina/";


          }


          /*
            Mauvaise réponse
          */

else{

  resultEl.textContent =
    'Mauvaise réponse , shame on you 😡😡😡';

  resultEl.className =
    'result bad';

  // Efface la saisie
  inputEl.value = '';

  // Replace le curseur dans le champ
  inputEl.focus();
}

        }
      );


    // ==========================================================
    // TOUCHE ENTREE
    // ==========================================================

    inputEl.addEventListener(
      'keydown',
      function(e){

        if(
          e.key === 'Enter'
        ){

          e.preventDefault();

          this.form.dispatchEvent(
            new Event(
              'submit',
              {
                cancelable:true
              }
            )
          );
        }

      }
    );

  </script>

</body>
</html>
